name: Check and Publish Docker Image

on:
  push:
    branches:
      - main

  release:
    types:
      - published

  pull_request:

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cloudflared

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true

      - name: Configure unprivileged ICMP
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          sysctl net.ipv4.ping_group_range

      - name: Test
        run: make test

  publish:
    name: Build and Publish
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64
        run: |
          docker build \
            -f Dockerfile.amd64 \
            --add-host athens.cfdata.org:127.0.0.1 \
            -t $IMAGE_NAME:amd64 \
            .

      - name: Build arm64
        run: |
          docker build \
            -f Dockerfile.arm64 \
            --add-host athens.cfdata.org:127.0.0.1 \
            -t $IMAGE_NAME:arm64 \
            .

      - name: Push amd64
        run: docker push $IMAGE_NAME:amd64

      - name: Push arm64
        run: docker push $IMAGE_NAME:arm64

      - name: Create latest multi-arch manifest
        run: |
          docker manifest create \
            $IMAGE_NAME:latest \
            $IMAGE_NAME:amd64 \
            $IMAGE_NAME:arm64

          docker manifest annotate \
            $IMAGE_NAME:latest \
            $IMAGE_NAME:amd64 \
            --os linux \
            --arch amd64

          docker manifest annotate \
            $IMAGE_NAME:latest \
            $IMAGE_NAME:arm64 \
            --os linux \
            --arch arm64

          docker manifest push $IMAGE_NAME:latest
